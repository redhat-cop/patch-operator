name: oci-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # Required for keyless signing with Cosign
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Setup ko
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.19.1

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image under a staging tag
        id: ko-build
        env:
          KO_DOCKER_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          IMAGE=$(ko build --bare --platform=linux/amd64,linux/arm64 . --push --tags="sha-${GITHUB_SHA}" \
            --image-label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --image-label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --image-label "org.opencontainers.image.version=${GITHUB_REF_NAME}")
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Scan image before release promotion (linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          version: v0.76.1
          image-ref: ${{ steps.ko-build.outputs.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          timeout: 10m

      - name: Scan image before release promotion (linux/arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          version: v0.76.1
          image-ref: ${{ steps.ko-build.outputs.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          timeout: 10m

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.ko-build.outputs.image }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image and attest SBOM
        run: |
          cosign sign --yes ${{ steps.ko-build.outputs.image }}
          cosign attest --yes --type spdxjson --predicate ${{ runner.temp }}/sbom.spdx.json ${{ steps.ko-build.outputs.image }}

      - name: Promote image to the release tag
        env:
          IMAGE: ${{ steps.ko-build.outputs.image }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: go run github.com/google/go-containerregistry/cmd/crane@v0.22.1 tag "${IMAGE}" "${RELEASE_TAG}"

  helm-release:
    name: helm-release
    runs-on: ubuntu-24.04
    needs: release
    permissions:
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: '4.2.0'

      - name: Build Helm chart
        # make helmchart renders config/helmchart (kustomize + Chart.yaml.tpl/values.yaml.tpl)
        # into ./charts/patch-operator. Its `helm` Makefile target only downloads to ./bin/helm
        # when no system `helm` is on PATH; with the pinned version installed above and on PATH,
        # Make reuses that instead and ./bin/helm is never created - use plain `helm` (PATH) below
        # rather than assuming ./bin/helm exists.
        run: |
          make helmchart VERSION=${{ github.ref_name }} IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Log in to the GitHub Container registry
        run: |
          helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Package and push chart
        # Published to this fork's own GHCR namespace (oci://ghcr.io/<owner>/charts/patch-operator),
        # not redhat-cop's gh-pages chart repo - publishing there would need COMMUNITY_OPERATOR_PAT/
        # REGISTRY_USERNAME/REGISTRY_PASSWORD secrets and admin-enabled GitHub Pages this fork
        # doesn't have, and shouldn't try to submit a fork's build to the upstream chart index anyway.
        run: |
          mkdir -p dist
          helm package ./charts/patch-operator -d dist
          helm push dist/patch-operator-*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
